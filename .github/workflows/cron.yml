name: Scheduled jobs

# Runs SLA monitoring, email/webhook retries, overdue tasks and cleanup every 5 minutes.
# Requires repository secrets APP_URL (e.g. https://duoonex.vercel.app) and CRON_SECRET.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger job runner
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not configured"; exit 0; fi
          curl --fail --silent --show-error --max-time 90 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
